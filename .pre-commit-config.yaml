default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
    - id: check
      name: check
      entry: just check
      language: system
      types: [python]
      require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: debug-statements
    - id: check-ast
    - id: check-json
    - id: check-toml
    - id: check-yaml
    - id: detect-private-key

  - repo: local
    hooks:
    - id: shellcheck
      name: shellcheck
      description: Test shell scripts with shellcheck
      entry: shellcheck
      language: system
      types: [shell]
      args: [-e, SC1091]

  - repo: https://github.com/bennettoxford/emailcheck
    rev: cb3b06644f4954861f5867b6235cdf9c000b74e2  # frozen: v1.0.1
    hooks:
      - id: emailcheck

exclude: coding_systems/snomedct/parser_utils/
